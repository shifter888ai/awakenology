<script type="module">
(function(){function looksChinesePage(){var text=document.body?(document.body.innerText||""):"";var han=(text.match(/[\\u3400-\\u9fff]/g)||[]).length;var kana=(text.match(/[\\u3040-\\u30ff]/g)||[]).length;var signals=(text.match(/[的了是我你他她這这個个與与為为會会來来說说時时間间麼么沒没還还從从們们]/g)||[]).length;return han>=30&&kana===0&&signals>=2}

</script>
