<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--muted:#666;--line:#ddd;--soft:#f6f6f6}
html[data-aw-theme="dark"]{color-scheme:dark;--bg:#111;--fg:#eee;--muted:#aaa;--line:#333;--soft:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.site-header{border-bottom:1px solid var(--line)}
.header-inner{max-width:900px;margin:0 auto;padding:22px 24px 18px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:18px;font-size:14px}
.nav a{padding-bottom:2px}
.nav-divider{color:var(--muted);user-select:none}
.nav a.active{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
main{max-width:760px;margin:0 auto;padding:58px 24px 70px}
.page-header{text-align:center;margin-bottom:24px}
.visual-intro{display:flex;align-items:center;justify-content:center;min-height:82px;color:var(--fg)}
.visual-intro svg{display:block;width:58px;height:58px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.utility-panel{border:1px solid var(--line);padding:24px;background:var(--soft)}
.utility-label{margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
search-bar-snippet{display:block;min-height:52px}
.utility-note{margin:18px 4px 0;color:var(--muted);font-size:13px;line-height:1.65}
.utility-note span{display:block}
.footer{border-top:1px solid var(--line);padding:24px}
.footer-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.footer-links{display:flex;align-items:center;gap:12px}
.footer-links a{color:var(--muted)}
.reddit-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;overflow:hidden}
.reddit-icon img{display:block;width:24px;height:22px;object-fit:contain;transform:translateX(1px)}
.reddit-one img{transform:translateX(1px) scale(1.08)}
.reddit-two img{transform:translateX(1px) scale(1.08);filter:brightness(0) saturate(100%) invert(39%) sepia(82%) saturate(1030%) hue-rotate(178deg) brightness(92%) contrast(94%)}
.reddit-three img{transform:translateX(1px) scale(.94);filter:brightness(0) saturate(100%) invert(32%) sepia(42%) saturate(1537%) hue-rotate(238deg) brightness(91%) contrast(92%)}
html[data-aw-theme="dark"] .reddit-three img{filter:brightness(0) saturate(100%) invert(76%) sepia(33%) saturate(1140%) hue-rotate(218deg) brightness(103%) contrast(94%)}
@media(max-width:700px){.header-inner{display:block;padding:18px 18px 14px}.brand{display:block;margin-bottom:12px}.nav{gap:14px}main{padding:44px 18px 55px}.page-header{margin-bottom:24px}.page-header h1{font-size:30px}.page-header p{font-size:15px}.utility-panel{padding:17px}.footer{padding:20px 14px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner">

<nav class="nav" aria-label="Site navigation">

<a href="/links/">Links</a>
</nav></div></header>
<main>
<header class="page-header"><h1 class="sr-only">Search Awakenology</h1><div class="visual-intro" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="27" cy="27" r="18"/><path d="m40 40 16 16"/></svg></div><p class="sr-only">Search the Awakenology library.</p></header>
<section class="utility-panel" aria-label="Search Awakenology articles">
<search-bar-snippet api-url="https://4405eb88-b5c8-4f18-b2fa-cb084e6f48c7.search.ai.cloudflare.com/" placeholder="" max-results="10" aria-label="Search Awakenology" translations='{"searchButtonLabel":"Search"}'></search-bar-snippet>
</section>
<p class="utility-note" aria-label="Search this site in English, Japanese, and Chinese"><span lang="en">Search this site.</span><span lang="ja">このサイトを検索します。</span><span lang="zh-Hant">搜尋本網站。</span></p>

<a href="/Disclaimer/">Disclaimer</a>
</span>

</div></footer>
<script type="module" src="https://4405eb88-b5c8-4f18-b2fa-cb084e6f48c7.search.ai.cloudflare.com/assets/v0.0.40/search-snippet.es.js"></script>
<script>
(function(){
  const ns='http://www.w3.org/2000/svg';
  function install(){
    const host=document.querySelector('search-bar-snippet');
    const root=host&&host.shadowRoot;
    if(!root)return;
    function apply(){
      const button=root.querySelector('.search-submit-button');
      if(!button)return;
      button.setAttribute('aria-label','Search');
      button.title='Search';
      if(!(button.children.length===1 && button.firstElementChild?.hasAttribute('data-aw-search-arrow'))){
        const svg=document.createElementNS(ns,'svg');
        svg.setAttribute('viewBox','0 0 24 24');
        svg.setAttribute('width','22');
        svg.setAttribute('height','22');
        svg.setAttribute('aria-hidden','true');
        svg.setAttribute('focusable','false');
        svg.setAttribute('fill','none');
        svg.setAttribute('stroke','currentColor');
        svg.setAttribute('stroke-width','2.2');
        svg.setAttribute('stroke-linecap','round');
        svg.setAttribute('stroke-linejoin','round');
        const shaft=document.createElementNS(ns,'path');
        shaft.setAttribute('d','M12 19V5');
        const head=document.createElementNS(ns,'path');
        head.setAttribute('d','m5 12 7-7 7 7');
        svg.append(shaft,head);
        svg.setAttribute('data-aw-search-arrow','');
        button.replaceChildren(svg);
      }
      button.style.width='44px';
      button.style.minWidth='44px';
      button.style.height='44px';
      button.style.padding='0';
      button.style.display='inline-flex';
      button.style.alignItems='center';
      button.style.justifyContent='center';
    }
    apply();
    new MutationObserver(apply).observe(root,{childList:true,subtree:true});
  }
  customElements.whenDefined('search-bar-snippet').then(install);
})();
</script>

<script>document.querySelectorAll(".copyright-current-year").forEach(function(el){el.textContent=new Date().getFullYear()});</script>
</body>
</html>
