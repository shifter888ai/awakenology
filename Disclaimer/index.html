<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disclaimer</title>
<meta name="description" content="Awakenology - Disclaimer">
<link rel="canonical" href="/Disclaimer/">

<style>
:root{color-scheme:dark;--bg:#111;--text:#eee;--muted:#aaa;--line:#333;--link:#fff}
html[data-aw-theme="light"]{color-scheme:light;--bg:#fff;--text:#111;--muted:#666;--line:#ddd;--link:#111}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.7}
a{color:var(--link)}
.site-header{border-bottom:1px solid var(--line)}
.header-inner{max-width:1000px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:20px;font-weight:600;text-decoration:none}
.nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.nav a{text-decoration:none}
.nav a:hover{text-decoration:underline}
.article{max-width:760px;margin:0 auto;padding:52px 20px 70px}
.article-header{text-align:center;margin-bottom:42px}
.article-header h1{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,2.5vw,25px);font-weight:600;line-height:1.15}
.article p{margin:0 0 10px;font-size:16px}
.site-footer{border-top:1px solid var(--line);padding:20px;font-size:13px;text-align:center;color:var(--muted)}
.site-footer .links{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.site-footer .links a{color:var(--muted)}
.site-footer .reddit-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;text-decoration:none;overflow:hidden}
.site-footer .reddit-icon img{display:block;width:24px;height:22px;object-fit:contain;transform:translateX(1px)}
.site-footer .reddit-one img{transform:translateX(1px) scale(1.08)}
.site-footer .reddit-two img{transform:translateX(1px) scale(1.08);filter:brightness(0) saturate(100%) invert(39%) sepia(82%) saturate(1030%) hue-rotate(178deg) brightness(92%) contrast(94%)}
.site-footer .reddit-three img{transform:translateX(1px) scale(.94);filter:brightness(0) saturate(100%) invert(32%) sepia(42%) saturate(1537%) hue-rotate(238deg) brightness(91%) contrast(92%)}
html[data-aw-theme="dark"] .site-footer .reddit-three img{filter:brightness(0) saturate(100%) invert(76%) sepia(33%) saturate(1140%) hue-rotate(218deg) brightness(103%) contrast(94%)}
@media(max-width:600px){.header-inner{display:block;padding:14px 16px}.brand{display:block;margin-bottom:10px}.nav{gap:12px}.article{padding:34px 16px 54px}.article p{font-size:16px;line-height:1.72}}
</style>
</head>
<body>
<header class="site-header">
<div class="header-inner">
<a class="brand" href="/">Awakenology</a>
<nav class="nav" aria-label="Language navigation">
<a href="/English/">English</a>
<a href="/Japanese/">日本語</a>
<a href="/Chinese/">中文</a>
<a href="/ai-search/">Search / Ask</a>
</nav>
</div>
</header>
<main class="article">
<article>
<header class="article-header">
<h1>Disclaimer</h1>
</header>
<p>All rights reserved since 2008. The content is intended solely for sharing experiences and providing reference without guarantees. Redistribution is allowed as long as it remains unchanged.</p>
</article>
</main>
<footer class="site-footer">

<a class="reddit-icon reddit-two" href="https://www.reddit.com/r/EscapePrisonPlanet/" aria-label="Reddit: Escape Prison Planet"><img src="/assets/reddit-two.svg" alt=""></a>
<a class="reddit-icon reddit-three" href="https://www.reddit.com/user/Lower-Lingonberry-40/" aria-label="Reddit: Lower-Lingonberry-40"><img src="/assets/reddit-three.svg" alt=""></a>
<a href="/Disclaimer/">Disclaimer</a>
</div>
<div>© 2024 Awakenology.org</div>
</footer>
</body>
</html>
