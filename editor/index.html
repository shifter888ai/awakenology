<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awakenology — Local Visual Editor (Prototype)</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color-scheme:dark;background:#151515;color:#eee}*{box-sizing:border-box}body{margin:0}header{padding:15px 20px;border-bottom:1px solid #444;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0 auto 0 0}button,.file{border:1px solid #666;background:#292929;color:inherit;border-radius:5px;padding:7px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input[type=file]{max-width:230px}nav{padding:10px 20px;display:flex;flex-wrap:wrap;gap:7px;border-bottom:1px solid #444}main{max-width:960px;margin:20px auto;padding:0 15px}iframe{display:block;width:100%;min-height:70vh;border:1px solid #555;background:white;border-radius:6px}#status{font-size:12px;color:#bbb;padding:8px 20px}small{color:#aaa}input[type=color]{height:32px;width:42px;vertical-align:middle} 
</style></head><body>
<header><h1>Awakenology · Local Visual Editor <small>prototype</small></h1><label>Load article HTML <input id="file" type="file" accept=".html,.htm,text/html"></label><button id="review" disabled>Review full-page HTML</button><button id="save" disabled>Download reviewed HTML</button></header>
<nav aria-label="Formatting"><button data-cmd="bold" disabled><b>Bold</b></button><button data-cmd="underline" disabled><u>Underline</u></button><button data-cmd="undo" disabled>Undo</button><button data-cmd="redo" disabled>Redo</button><label>Text color <input id="color" type="color" value="#0000ff" disabled></label><button id="spacer" disabled>Insert blank line</button></nav>
<div id="status" role="status">Choose a local article HTML file. Nothing is uploaded or saved automatically.</div><section id="reviewPanel" hidden style="max-width:960px;margin:12px auto;padding:12px 15px;border:1px solid #555;border-radius:6px"><h2 style="font-size:16px">Review before download</h2><p id="reviewSummary"></p><p><strong>Safety note:</strong> Browser serialization can normalize HTML markup. The original file is never changed. Inspect the downloaded copy before using it.</p><iframe id="fullPreview" title="Reconstructed full-page preview" style="width:100%;min-height:50vh;background:white"></iframe><button id="cancelReview">Cancel review</button></section>
<main><iframe id="preview" title="Article editing preview" sandbox="allow-same-origin"></iframe></main>
<script>
(()=>{'use strict';
const file=document.querySelector('#file'), frame=document.querySelector('#preview'), main=document.querySelector('main'), save=document.querySelector('#save'), review=document.querySelector('#review'), status=document.querySelector('#status'), panel=document.querySelector('#reviewPanel'), fullPreview=document.querySelector('#fullPreview');
let original=null, filename='', loaded=false, reviewedHtml=null, fullPageReady=false;
const controls=[...document.querySelectorAll('[data-cmd],#color,#spacer')];
function setStatus(s){status.textContent=s}
function doc(){return frame.contentDocument}
function article(){return doc()?.querySelector('.article')}
function ready(){return loaded && !!article()}
function withinSelection(){const sel=frame.contentWindow.getSelection();return !!(sel&&sel.rangeCount&&article().contains(sel.getRangeAt(0).commonAncestorContainer))}
file.addEventListener('change',async()=>{const f=file.files?.[0];if(!f)return;const text=await f.text();const parsed=new DOMParser().parseFromString(text,'text/html');if(!parsed.querySelector('.article')){setStatus('This prototype requires an article container with class="article". No changes made.');return}
original=text;filename=f.name;loaded=false;save.disabled=true;review.disabled=true;panel.hidden=true;main.hidden=false;reviewedHtml=null;fullPageReady=!!(parsed.querySelector('header, .site-header')&&parsed.querySelector('footer, .site-footer, .footer-inner'));controls.forEach(x=>x.disabled=true);
frame.onload=()=>{const a=article();if(!a){setStatus('Could not load article.');return}a.contentEditable='true';a.spellcheck=false;loaded=true;review.disabled=!fullPageReady;controls.forEach(x=>x.disabled=false);setStatus(fullPageReady?'Editing '+filename+' locally. Full-page header/footer detected; review will preserve the surrounding page.':'Editing '+filename+' locally. This looks like an article fragment: editing works, but full-page review is disabled. Load the original full-page HTML containing its header and footer to preserve the whole page.')};
frame.srcdoc=text;
});
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
document.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>{if(!ready()||!withinSelection())return;doc().execCommand(b.dataset.cmd,false,null);article().focus()}));
document.querySelector('#color').addEventListener('input',e=>{if(!ready()||!withinSelection())return;doc().execCommand('foreColor',false,e.target.value)});
document.querySelector('#spacer').addEventListener('mousedown',e=>e.preventDefault());
document.querySelector('#spacer').addEventListener('click',()=>{if(!ready()||!withinSelection())return;doc().execCommand('insertHTML',false,'<p class="spacer"></p>')});
function buildReviewedHtml(){const parsed=new DOMParser().parseFromString(original,'text/html');const sourceArticle=parsed.querySelector('.article');const edited=article().cloneNode(true);edited.removeAttribute('contenteditable');edited.removeAttribute('spellcheck');sourceArticle.replaceWith(edited);return '<!doctype html>\n'+parsed.documentElement.outerHTML;}
review.addEventListener('click',()=>{if(!ready()||!original)return;reviewedHtml=buildReviewedHtml();const before=new DOMParser().parseFromString(original,'text/html').querySelector('.article');const after=new DOMParser().parseFromString(reviewedHtml,'text/html').querySelector('.article');const b=(before?.innerText||before?.textContent||'').trim();const a=(after?.innerText||after?.textContent||'').trim();document.querySelector('#reviewSummary').textContent='Full-page copy prepared. Article text '+(b===a?'is unchanged.':'has changed.')+' Original page elements outside .article are retained. Inspect the preview below before downloading.';fullPreview.srcdoc=reviewedHtml;panel.hidden=false;main.hidden=true;save.disabled=false;setStatus('Review generated locally. Only the reviewed page is shown. Nothing has been downloaded or uploaded yet.');});
document.querySelector('#cancelReview').addEventListener('click',()=>{panel.hidden=true;main.hidden=false;reviewedHtml=null;save.disabled=true;setStatus('Review cancelled. Original file remains unchanged.');});
save.addEventListener('click',()=>{if(!reviewedHtml){setStatus('Click Review full-page HTML first.');return;}const url=URL.createObjectURL(new Blob([reviewedHtml],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename.replace(/\\.html?$/i,'')+'-reviewed.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus('Downloaded a reconstructed full-page HTML copy. Original file remains unchanged; inspect the downloaded page before using it.');});
})();
</script></body></html>
