name: Static HTML PoC (isolated)
on:
  push:
    branches:
      - poc/static-html-build-parity
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/static_html_poc/**'
      - '.github/workflows/static-html-poc.yml'
      - 'docs/static-html-poc/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s scripts/static_html_poc -p 'test_*.py' -v
      - run: python scripts/static_html_poc/check_real_pages.py
      - name: Require current live Worker signature parity (nine fixtures)
        run: python scripts/static_html_poc/check_live_parity.py
  browser-parity:
    runs-on: ubuntu-latest
    needs: parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Compare generated and live pages in desktop and mobile Chromium
        run: python scripts/static_html_poc/check_browser_parity.py
      - name: Upload browser parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-html-browser-parity
          path: browser-parity-report.json
          if-no-files-found: warn
