name: Static HTML PoC (isolated)
on:
  push:
    branches:
      - poc/static-html-build-parity
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/static_html_poc/**'
      - '.github/workflows/static-html-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s scripts/static_html_poc -p 'test_*.py' -v
      - run: python scripts/static_html_poc/check_real_pages.py
      - name: Observe current live Worker parity (diagnostic; not a release gate)
        continue-on-error: true
        run: python scripts/static_html_poc/check_live_parity.py
