name: Static HTML PoC (isolated)
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/static_html_poc/**'
      - '.github/workflows/static-html-poc.yml'
      - 'docs/static-html-poc/**'
  workflow_dispatch:
    inputs:
      run_live_checks:
        description: 'Run bounded read-only production signature, HTTP contract, and browser checks'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s scripts/static_html_poc -p 'test_*.py' -v
      - run: python scripts/static_html_poc/check_real_pages.py
  full-inventory:
    runs-on: ubuntu-24.04
    needs: parity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Diagnose known malformed source metadata
        run: python scripts/static_html_poc/diagnose_malformed_head.py
      - name: Validate all tracked public HTML routes
        run: python scripts/static_html_poc/check_full_inventory.py
      - name: Build isolated temporary HTML staging tree
        run: python scripts/static_html_poc/build_staging.py
      - name: Upload staging and inventory reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: static-html-staging-and-inventory
          path: |
            static-html-full-inventory-report.json
            static-html-staging-report.json
          if-no-files-found: warn
  live-worker-signature:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_checks == true
    needs: parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Compare pinned fixtures with the live Worker
        run: python scripts/static_html_poc/check_live_parity.py
  runtime-contract:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_checks == true
    needs: full-inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Probe read-only production HTTP contracts
        run: python scripts/static_html_poc/check_runtime_contracts.py
      - name: Upload runtime contract report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: static-html-runtime-contract-report
          path: static-html-runtime-contract-report.json
          if-no-files-found: warn
  browser-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_checks == true
    runs-on: ubuntu-24.04
    needs: parity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 playwright pillow numpy
      - run: python -m playwright install --with-deps chromium
      - name: Compare generated and live pages in desktop and mobile Chromium
        run: python scripts/static_html_poc/check_browser_parity.py
      - name: Upload browser parity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: static-html-browser-parity
          path: |
            browser-parity-report.json
            browser-parity-screenshots/
          if-no-files-found: warn
