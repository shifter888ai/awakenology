name: SEO metadata inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - 'worker.js'
      - 'sitemap.xml'
      - 'scripts/audit_seo_metadata.py'
      - '.github/workflows/seo-metadata-inventory.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_seo_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo-metadata-report
          path: seo-metadata-report.csv
