name: Deploy Awakenology

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'tests/test_deploy_workflow_policy.py'
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Explicitly approve deployment to the production Cloudflare Worker'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: awakenology-production-deploy
  cancel-in-progress: false

jobs:
  policy-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run offline deployment approval policy tests
        run: python -m unittest discover -s tests -p 'test_deploy_workflow_policy.py' -v

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
