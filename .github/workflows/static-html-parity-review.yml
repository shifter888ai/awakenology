name: Static HTML parity review (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated PoC branch
        uses: actions/checkout@v4
        with:
          ref: poc/static-html-current-main-revalidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s scripts/static_html_poc -p 'test_*.py' -v
      - name: Representative source pages
        run: python scripts/static_html_poc/check_real_pages.py
      - name: Compare current live Worker signatures
        run: python scripts/static_html_poc/check_live_parity.py
      - name: Diagnose malformed metadata
        run: python scripts/static_html_poc/diagnose_malformed_head.py
      - name: Validate all tracked public HTML routes
        run: python scripts/static_html_poc/check_full_inventory.py
      - name: Upload full inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-html-full-inventory
          path: static-html-full-inventory-report.json
          if-no-files-found: warn
  browser-parity:
    runs-on: ubuntu-latest
    needs: source-parity
    steps:
      - name: Check out isolated PoC branch
        uses: actions/checkout@v4
        with:
          ref: poc/static-html-current-main-revalidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 playwright pillow numpy
      - run: python -m playwright install --with-deps chromium
      - name: Compare generated and live pages in desktop and mobile Chromium
        run: python scripts/static_html_poc/check_browser_parity.py
      - name: Upload browser parity report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-html-browser-parity
          path: |
            browser-parity-report.json
            browser-parity-screenshots/
          if-no-files-found: warn
