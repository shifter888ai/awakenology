name: Live SEO runtime audit
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  live-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser audit dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Compile audit scripts and run parser tests
        run: |
          python3 -m py_compile scripts/audit_seo_metadata.py scripts/audit_live_seo.py scripts/audit_browser_smoke.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/audit_site_integrity.py
          python3 scripts/audit_live_links_assets.py
          python3 scripts/audit_anchor_accessibility.py
      - name: Generate source metadata inventory
        run: python3 scripts/audit_seo_metadata.py
      - name: Audit production-rendered metadata
        run: python3 scripts/audit_live_seo.py
      - name: Audit live pages in Chromium
        run: python3 scripts/audit_browser_smoke.py --screenshots
      - name: Consolidate audit reports after all scans finish
        if: always()
        run: python3 scripts/consolidate_audit_reports.py
      - name: Upload source and runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-source-and-runtime-reports
          path: |
            seo-metadata-report.csv
            seo-runtime-report.csv
            site-integrity-report.csv
            live-link-asset-report.csv
            anchor-accessibility-report.csv
            audit-issue-register.csv
            audit-summary.md
            browser-smoke-report.csv
            browser-smoke-screenshots/*.png
          if-no-files-found: warn
