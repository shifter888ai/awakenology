name: New Page Generator Tests

on:
  pull_request:
    paths:
      - "new-page-generator/**"
      - ".github/workflows/new-page-generator-tests.yml"
  push:
    branches:
      - "feature/new-page-generator-phase3"
    paths:
      - "new-page-generator/**"
      - ".github/workflows/new-page-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-page-generator
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new-page-generator/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run generator tests
        run: npm test
