name: New Page Generator Tests

on:
  pull_request:
    paths:
      - "new-page-generator/**"
      - ".github/workflows/new-page-generator-tests.yml"
  push:
    branches:
      - "feature/new-page-generator-phase3"
    paths:
      - "new-page-generator/**"
      - ".github/workflows/new-page-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-page-generator
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run generator tests
        run: npm test
      - name: Audit uploaded pilot DOCX without approving generation
        run: node pilot-ci-audit.mjs
      - name: Generate isolated shell layout preview
        run: node shell-layout-preview.mjs
      - name: Verify source-image and paragraph review artifact
        run: |
          test -s pilot-artifacts/pilot-visual-review.html
          grep -q 'All source paragraphs (184)' pilot-artifacts/pilot-visual-review.html || { echo "::error::Missing expected review marker: All source paragraphs (184) in pilot-artifacts/pilot-visual-review.html"; exit 1; }
          grep -q 'Linear source sequence (text and images)' pilot-artifacts/pilot-visual-review.html || { echo "::error::Missing expected review marker: Linear source sequence (text and images) in pilot-artifacts/pilot-visual-review.html"; exit 1; }
          grep -q 'Source image 1' pilot-artifacts/pilot-visual-review.html || { echo "::error::Missing expected review marker: Source image 1 in pilot-artifacts/pilot-visual-review.html"; exit 1; }
          grep -q 'Paragraph 184:' pilot-artifacts/pilot-visual-review.html || { echo "::error::Missing expected review marker: Paragraph 184: in pilot-artifacts/pilot-visual-review.html"; exit 1; }
          grep -q 'manual visual review required' pilot-artifacts/pilot-visual-review.html || { echo "::error::Missing expected review marker: manual visual review required in pilot-artifacts/pilot-visual-review.html"; exit 1; }
          test -s pilot-artifacts/shell-layout-preview.html
          test -s pilot-artifacts/pilot-converted-preview.html
          test -s pilot-artifacts/pilot-language-segments.html
          grep -q 'REVIEW ONLY — NOT APPROVED FOR PUBLICATION' pilot-artifacts/pilot-language-segments.html || { echo "::error::Missing non-publishable review label in language-segment preview"; exit 1; }
          grep -q '繁體中文 (zh-Hant)' pilot-artifacts/pilot-language-segments.html || { echo "::error::Missing Traditional Chinese segment"; exit 1; }
          grep -q 'English (en)' pilot-artifacts/pilot-language-segments.html || { echo "::error::Missing English segment"; exit 1; }
          grep -q '日本語 (ja)' pilot-artifacts/pilot-language-segments.html || { echo "::error::Missing Japanese segment"; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=JSON.parse(readFileSync('pilot-artifacts/pilot-audit.json','utf8'));
          const comparison=report.languageRichComparison;
          const expected=['zh-Hant','en','ja'];
          if(comparison?.ok!==true || !Array.isArray(comparison.segments) || comparison.segments.length!==3) {
            console.error('Per-language rich-content comparison is blocked:',JSON.stringify(comparison));
            process.exit(1);
          }
          for(let i=0;i<expected.length;i++) {
            const segment=comparison.segments[i];
            if(segment.language!==expected[i] || segment.ok!==true || segment.paragraphTextMatches!==true || segment.issueCount!==0 ||
               segment.source.paragraphCount!==segment.rendered.paragraphCount ||
               segment.source.imageCount!==segment.rendered.imageCount ||
               segment.source.lineBreakCount!==segment.rendered.lineBreakCount) {
              console.error('Language integrity mismatch:',JSON.stringify(segment));
              process.exit(1);
            }
          }
          console.log('Per-language source/rendered fidelity PASS: zh-Hant, en, ja; no unexplained rich-content issues.');
          NODE
          test -s pilot-artifacts/pilot-language-bundle.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const bundle=JSON.parse(readFileSync('pilot-artifacts/pilot-language-bundle.json','utf8'));
          const expected=['en','ja','zh-Hant'];
          if(bundle.ok!==true || bundle.stage!=='review-only-trilingual-bundle' || bundle.publishable!==false ||
             !bundle.htmlPageSetValidation?.ok || bundle.languageRichComparison?.ok!==true) {
            console.error('Review-only generation bundle is blocked or incorrectly labelled:',JSON.stringify({ok:bundle.ok,stage:bundle.stage,publishable:bundle.publishable,errors:bundle.errors}));
            process.exit(1);
          }
          if(JSON.stringify(Object.keys(bundle.pages).sort())!==JSON.stringify(expected)) {
            console.error('Bundle language set mismatch:',Object.keys(bundle.pages));
            process.exit(1);
          }
          for(const lang of expected) {
            const page=bundle.pages[lang];
            if(page.publishable!==false || typeof page.articleHtml!=='string' || !page.articleHtml.trim() ||
               typeof page.previewHtml!=='string' || !page.previewHtml.startsWith('<!doctype html>') || page.imageCount!==1 ||
               !page.previewHtml.includes('REVIEW PREVIEW — NOT FOR PUBLICATION') ||
               !page.previewHtml.includes('class="theme-toggle"') || !page.previewHtml.includes('class="return-top"') ||
               !page.previewHtml.includes('hreflang="en"') || !page.previewHtml.includes('hreflang="ja"') ||
               !page.previewHtml.includes('hreflang="zh-Hant"') ||
               !page.previewHtml.includes('href="/English/"') || !page.previewHtml.includes('href="/Japanese/"') ||
               !page.previewHtml.includes('href="/Chinese/"') || !page.previewHtml.includes('href="/ai-search/"') ||
               !page.previewHtml.includes('mailto:contact@awakenology.org') || !page.previewHtml.includes('href="/Disclaimer/"') ||
               !page.previewHtml.includes('addEventListener("pointerup"') ||
               (page.previewHtml.match(/class="theme-toggle"/g) || []).length!==1 ||
               page.previewHtml.includes('<main><h1>')) {
              console.error('Invalid complete review-only page preview:',lang);
              process.exit(1);
            }
          }
          console.log('Review-only trilingual bundle PASS: three complete watermarked static page previews, reciprocal language metadata, one source image each; no production shell approval.');
          NODE
          for lang in en ja zh-Hant; do
            test -s "pilot-artifacts/review-pages/$lang.html" || { echo "::error::Missing standalone preview $lang.html"; exit 1; }
            grep -q '<!doctype html>' "pilot-artifacts/review-pages/$lang.html" || { echo "::error::Invalid standalone HTML for $lang"; exit 1; }
            grep -q 'REVIEW PREVIEW — NOT FOR PUBLICATION' "pilot-artifacts/review-pages/$lang.html" || { echo "::error::Missing watermark for $lang"; exit 1; }
            grep -q 'src="data:image/' "pilot-artifacts/review-pages/$lang.html" || { echo "::error::Embedded source image missing for $lang"; exit 1; }
            if grep -q 'src="/assets/' "pilot-artifacts/review-pages/$lang.html"; then echo "::error::Unresolved local image path in $lang preview"; exit 1; fi
          done
          echo "Standalone visual review pages PASS: embedded images, local-file compatible, watermark present."
          (grep -q 'NOT APPROVED FOR PUBLICATION' pilot-artifacts/pilot-converted-preview.html || grep -q 'REVIEW PREVIEW — NOT FOR PUBLICATION' pilot-artifacts/pilot-converted-preview.html) || { echo "::error::Missing non-publishable review watermark in pilot-converted-preview.html"; exit 1; }
          grep -q 'LAYOUT PREVIEW ONLY' pilot-artifacts/shell-layout-preview.html || { echo "::error::Missing expected review marker: LAYOUT PREVIEW ONLY in pilot-artifacts/shell-layout-preview.html"; exit 1; }
          grep -q 'class="theme-toggle"' pilot-artifacts/shell-layout-preview.html || { echo "::error::Missing expected review marker: class="theme-toggle" in pilot-artifacts/shell-layout-preview.html"; exit 1; }
          grep -q 'class="return-top"' pilot-artifacts/shell-layout-preview.html || { echo "::error::Missing expected review marker: class="return-top" in pilot-artifacts/shell-layout-preview.html"; exit 1; }
      - name: Upload pilot diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trilingual-docx-pilot-audit
          path: |
            new-page-generator/pilot-artifacts/pilot-audit.json
            new-page-generator/pilot-artifacts/pilot-visual-review.html
            new-page-generator/pilot-artifacts/shell-layout-preview.html
            new-page-generator/pilot-artifacts/pilot-converted-preview.html
            new-page-generator/pilot-artifacts/pilot-language-segments.html
            new-page-generator/pilot-artifacts/pilot-language-bundle.json
            new-page-generator/pilot-artifacts/review-pages/*.html
          if-no-files-found: warn
      - name: Publish pilot findings in job summary
        if: always()
        run: |
          {
            echo '## Trilingual DOCX pilot diagnostic'
            echo
            if [ -f pilot-artifacts/pilot-audit.json ]; then
              echo 'Diagnostic report (not approval for generation):'
              echo '```json'
              cat pilot-artifacts/pilot-audit.json
              echo '```'
            else
              echo 'Diagnostic report was not generated; inspect preceding job steps.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Surface pilot blockers as GitHub annotations
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, existsSync} from 'node:fs';
          const path = 'pilot-artifacts/pilot-audit.json';
          if (!existsSync(path)) {
            console.log('::warning file=new-page-generator/pilot-ci-audit.mjs::Pilot audit report missing');
          } else {
            const report = JSON.parse(readFileSync(path,'utf8'));
            console.log('Pilot SHA-256: ' + report.sha256);
            for (const [stage, result] of Object.entries(report.stages)) {
              console.log(stage + ': ' + (result.ok ? 'PASS' : 'BLOCKED'));
              for (const message of result.errors) {
                const safe = String(message).replace(/[\r\n]/g,' ').replace(/%/g,'%25').replace(/:/g,'%3A');
                console.log('::warning file=new-page-generator/pilot-ci-audit.mjs,title=' + stage + '::' + safe);
              }
            }
          }
          NODE
