name: Deploy GitHub-hosted visual editor

on:
  push:
    branches: [main]
    paths:
      - "github-editor/**"
      - ".github/workflows/deploy-github-editor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-editor-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload editor site
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-editor

      - name: Deploy editor site
        id: deployment
        uses: actions/deploy-pages@v4
