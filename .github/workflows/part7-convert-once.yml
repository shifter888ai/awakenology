name: Convert Part 7 to Traditional Chinese
on:
  push:
    branches: [fix/part7-traditional-character-conversion]
    paths: [.github/workflows/part7-convert-once.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/part7-traditional-character-conversion
      - run: sudo apt-get update && sudo apt-get install -y icu-devtools
      - name: Convert characters only
        run: |
          set -e
          uconv -x 'Simplified-Traditional' < '與退化派對話7/index.html' > /tmp/converted.html
          cp /tmp/converted.html '與退化派對話7/index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '與退化派對話7/index.html'
          git commit -m 'Convert Part 7 to Traditional Chinese characters'
          git push origin HEAD:fix/part7-traditional-character-conversion
