name: One-time Part 7 Traditional Chinese conversion
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  convert:
    if: github.event.pull_request.head.ref == 'fix/part7-traditional-character-conversion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/part7-traditional-character-conversion
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y icu-devtools
      - name: Convert only Simplified Chinese characters
        shell: bash
        run: |
          set -euo pipefail
          file='與退化派對話7/index.html'
          uconv -x 'Simplified-Traditional' < "$file" > /tmp/converted.html
          test -s /tmp/converted.html
          cp /tmp/converted.html "$file"
          git rm .github/workflows/part7-convert-once.yml .github/workflows/part7-convert-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'Convert Part 7 article to Traditional Chinese characters'
          git push origin HEAD:fix/part7-traditional-character-conversion
