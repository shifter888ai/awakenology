body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.6}

.language-choice a:last-child{color:var(--link)}
.search-link a{color:var(--link);border-color:var(--link)}
.search-link a:hover{background:var(--link);color:var(--bg);border-color:var(--link)}
.language-choice-label{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;font-size:16px;font-weight:700;letter-spacing:.01em;color:var(--link)}
.search-link{margin:30px 0 0;font-size:15px}
.search-link a{display:inline-block;padding:10px 18px;border:1px solid var(--line);background:var(--soft);text-decoration:none}
.search-link a:hover{border-color:var(--muted);text-decoration:none}
html[data-aw-theme="dark"] .search-link a:hover,html[data-aw-theme="dark"] .search-link a:focus-visible{background:var(--link)!important;color:#fff!important;border-color:var(--link)!important}
.coach-link{display:flex;flex-direction:column;align-items:center;gap:8px;margin:60px auto 0;width:min(240px,100%);color:var(--fg);text-decoration:none}
.coach-link img{display:block;width:60px;height:60px;object-fit:contain}
.coach-caption{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700}
.coach-description{font-size:13px;line-height:1.45;color:var(--muted)}
.coach-link img{mix-blend-mode:multiply}
html[data-aw-theme="dark"] .coach-link img{filter:invert(1);mix-blend-mode:screen}
.footer{border-top:1px solid var(--line);padding:24px}
.footer-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.footer-links{display:flex;align-items:center;gap:12px}
.contact-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;font-size:20px;line-height:1}

.reddit-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;overflow:hidden}
.reddit-icon img{display:block;width:24px;height:22px;object-fit:contain;transform:translateX(1px)}
.reddit-one img{transform:translateX(1px) scale(1.08)}

@media(max-width:700px){

  .search-link{margin-top:22px}
  .coach-link{margin-top:24px}
  .coach-description{max-width:230px}
  .footer{padding:20px 14px}
}
