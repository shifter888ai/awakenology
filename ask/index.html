<style>
:root{color-scheme:light;--bg:#fff;--fg:#111;--muted:#666;--line:#ddd;--soft:#f6f6f6}
html[data-aw-theme="dark"]{color-scheme:dark;--bg:#111;--fg:#eee;--muted:#aaa;--line:#333;--soft:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.site-header{border-bottom:1px solid var(--line)}
.header-inner{max-width:900px;margin:0 auto;padding:22px 24px 18px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:18px;font-size:14px}
.nav a{padding-bottom:2px}
.nav-divider{color:var(--muted);user-select:none}
.nav a.active{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
main{max-width:1040px;margin:0 auto;padding:42px 24px 60px}
.page-header{text-align:center;margin-bottom:26px}
.visual-intro{display:flex;align-items:center;justify-content:center;gap:18px;min-height:82px;color:var(--fg)}
.visual-intro svg{display:block;width:54px;height:54px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.chat-shell{width:100%;min-height:640px;border:1px solid var(--line);background:var(--bg);overflow:hidden;--search-snippet-primary-color:#222;--search-snippet-primary-hover:#444;--search-snippet-background:var(--bg);--search-snippet-surface:var(--soft);--search-snippet-text-color:var(--fg);--search-snippet-text-secondary:var(--muted);--search-snippet-border-color:var(--line);--search-snippet-user-message-bg:#333;--search-snippet-user-message-text:#fff;--search-snippet-assistant-message-bg:var(--soft);--search-snippet-assistant-message-text:var(--fg);--search-snippet-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;--search-snippet-border-radius:8px}
html[data-aw-theme="dark"] .chat-shell{--search-snippet-primary-color:#ddd;--search-snippet-primary-hover:#fff;--search-snippet-user-message-bg:#444;--search-snippet-user-message-text:#fff}
chat-page-snippet{display:block;width:100%;height:640px;min-height:640px}
.chat-note{margin:14px 2px 0;color:var(--muted);font-size:13px;line-height:1.5}
.footer{border-top:1px solid var(--line);padding:24px}
.footer-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.footer-links{display:flex;align-items:center;gap:12px}
.footer-links a{color:var(--muted)}
.reddit-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;overflow:hidden}
.reddit-icon img{display:block;width:24px;height:22px;object-fit:contain;transform:translateX(1px)}
.reddit-one img{transform:translateX(1px) scale(1.08)}
.reddit-two img{transform:translateX(1px) scale(1.08);filter:brightness(0) saturate(100%) invert(39%) sepia(82%) saturate(1030%) hue-rotate(178deg) brightness(92%) contrast(94%)}
.reddit-three img{transform:translateX(1px) scale(.94);filter:brightness(0) saturate(100%) invert(32%) sepia(42%) saturate(1537%) hue-rotate(238deg) brightness(91%) contrast(92%)}
html[data-aw-theme="dark"] .reddit-three img{filter:brightness(0) saturate(100%) invert(76%) sepia(33%) saturate(1140%) hue-rotate(218deg) brightness(103%) contrast(94%)}
@media(max-width:700px){.header-inner{display:block;padding:18px 18px 14px}.brand{display:block;margin-bottom:12px}.nav{gap:14px}main{padding:34px 12px 44px}.page-header{margin-bottom:20px}.page-header h1{font-size:30px}.page-header p{font-size:15px}.chat-shell{min-height:560px}chat-page-snippet{height:560px;min-height:560px}.footer{padding:20px 14px}}
</style>
